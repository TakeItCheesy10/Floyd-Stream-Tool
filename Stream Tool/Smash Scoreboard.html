<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Floyd Esports — Super Smash Bros. Ultimate Scoreboard</title><link rel="stylesheet" href="Resources/StreetFighter6/overlay.css?v=score-tiles-4"><link rel="stylesheet" href="Resources/SmashUltimate/smash.css"></head>
<body><main class="scorebug" aria-label="Super Smash Bros. Ultimate live scoreboard">
  <section class="battle-frame">
    <article class="side home"><div class="meter-frame"><div class="health-rail"></div><div class="team-row"><strong id="p1Team">HOME TEAM</strong><b id="p1Score" class="set-score">0</b></div><div id="p1SetPips" class="set-pips" aria-label="Home set wins"></div></div>
      <div class="player-row"><div class="player-identity"><img id="p1Icon" class="character-icon" alt="" hidden><span id="p1IconUnknown" class="icon-unknown">?</span><div class="fighter-card"><strong id="p1Name">PLAYER 1</strong><small id="p1Character">SELECT FIGHTER</small></div></div><div class="battle-wins"><div id="p1BattlePips" class="battle-pips"></div><b id="p1BattleScore">0</b></div></div></article>
    <div class="center-brand"><div class="brand-plate"><img src="Resources/Branding/floyd-bronco.png" alt="Floyd Broncos"></div></div>
    <article class="side away"><div class="meter-frame"><div class="health-rail"></div><div class="team-row"><b id="p2Score" class="set-score">0</b><strong id="p2Team">AWAY TEAM</strong></div><div id="p2SetPips" class="set-pips" aria-label="Away set wins"></div></div>
      <div class="player-row"><div class="battle-wins"><b id="p2BattleScore">0</b><div id="p2BattlePips" class="battle-pips"></div></div><div class="player-identity"><div class="fighter-card"><strong id="p2Name">PLAYER 2</strong><small id="p2Character">SELECT FIGHTER</small></div><img id="p2Icon" class="character-icon" alt="" hidden><span id="p2IconUnknown" class="icon-unknown">?</span></div></div></article>
  </section>
</main><script src="Resources/SmashUltimate/fighter-art.js"></script><script src="Resources/SmashUltimate/overlay.js"></script></body></html>
