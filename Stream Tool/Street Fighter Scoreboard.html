<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Floyd Esports — Street Fighter 6 Scoreboard</title><link rel="stylesheet" href="Resources/StreetFighter6/overlay.css"></head>
<body><main class="scorebug" aria-label="Street Fighter 6 live scoreboard">
  <div class="event-line"><span>STREET FIGHTER 6</span><span id="eventName">FLOYD ESPORTS</span><span id="roundName">MATCH DAY</span></div>
  <section class="battle-frame">
    <article class="side home"><div class="meter-frame"><div class="health-rail"></div><div class="team-row"><strong id="p1Team">HOME TEAM</strong><b id="p1Score" class="set-score">0</b></div><div id="p1SetPips" class="set-pips" aria-label="Home set wins"></div></div>
      <div class="player-row"><div class="fighter-card"><strong id="p1Name">PLAYER 1</strong><small id="p1Character">SELECT FIGHTER</small></div><div class="battle-wins"><div id="p1BattlePips" class="battle-pips"></div><b id="p1BattleScore">0</b></div></div></article>
    <div class="center-brand"><div class="brand-plate"><img src="Resources/Branding/floyd-esports.png" alt="Floyd Esports"></div><span id="seriesLabel">BEST OF 5</span><small>SET WINS</small></div>
    <article class="side away"><div class="meter-frame"><div class="health-rail"></div><div class="team-row"><b id="p2Score" class="set-score">0</b><strong id="p2Team">AWAY TEAM</strong></div><div id="p2SetPips" class="set-pips" aria-label="Away set wins"></div></div>
      <div class="player-row"><div class="battle-wins"><b id="p2BattleScore">0</b><div id="p2BattlePips" class="battle-pips"></div></div><div class="fighter-card"><strong id="p2Name">PLAYER 2</strong><small id="p2Character">SELECT FIGHTER</small></div></div></article>
  </section>
  <div class="match-line"><span>BATTLE WINS · BEST OF 3</span><strong id="matchPosition">SET 1 · BATTLE 1</strong><span>FLOYD ESPORTS</span></div>
</main><script src="Resources/StreetFighter6/overlay.js"></script></body></html>
