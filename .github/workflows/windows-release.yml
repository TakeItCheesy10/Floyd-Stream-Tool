name: Windows desktop release
on:
  push:
    branches:
      - feature/multi-game-foundation
    paths:
      - 'Interface Source Code/package.json'
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Interface Source Code
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Interface Source Code/package-lock.json
      - name: Check release version
        run: node -e "if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag and application version must match')"
      - run: npm ci
      - run: npm test
      - name: Build installer and update metadata
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Publish only after all update files are uploaded
        run: |
          $tag = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          $version = $tag.Substring(1)
          $files = @("dist/Floyd-Stream-Tool-Setup-$version.exe", "dist/Floyd-Stream-Tool-Setup-$version.exe.blockmap", 'dist/latest.yml')
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file)) { throw "Missing release file: $file" } }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release tag' }
          }
          gh release view $tag --json isDraft | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --verify-tag --title "Floyd Stream Tool $version" --notes-file ../RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($file in $files) {
            $name = Split-Path -Leaf $file
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (!$asset -or $asset.size -ne (Get-Item -LiteralPath $file).Length) { throw "Release asset verification failed: $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified release' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
