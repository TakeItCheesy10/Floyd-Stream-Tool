name: Windows desktop release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Interface Source Code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Interface Source Code/package-lock.json
      - name: Check release version
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag and application version must match')"
      - run: npm ci
      - run: npm test
      - name: Build and publish installer with update metadata
        run: npx --no-install electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
