name: Security test build
on:
  push:
    branches: [security/update-candidate]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Interface Source Code
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Update Electron and dependencies
        shell: pwsh
        run: |
          npm install --save-dev --save-exact electron@45.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm version 2.1.4-beta.1 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        run: npm test
      - name: Run dependency audits
        shell: pwsh
        run: |
          npm audit --json | Out-File -Encoding utf8 audit-all.json
          npm audit --omit=dev --json | Out-File -Encoding utf8 audit-production.json
          node -e "for (const n of ['audit-all.json','audit-production.json']) {const f=require('fs').readFileSync(n,'utf8').replace(/^\uFEFF/,''); const a=JSON.parse(f); console.log(n,JSON.stringify(a.metadata));}"
      - name: Build portable test app
        run: npx --no-install electron-builder --dir --win --x64 --publish never
      - name: Upload test app
        uses: actions/upload-artifact@v4
        with:
          name: Floyd-Stream-Tool-security-test-Windows
          path: Interface Source Code/dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency files and audit
        uses: actions/upload-artifact@v4
        with:
          name: Floyd-security-test-dependency-files
          path: |
            Interface Source Code/package.json
            Interface Source Code/package-lock.json
            Interface Source Code/audit-all.json
            Interface Source Code/audit-production.json
          if-no-files-found: error
          retention-days: 14
