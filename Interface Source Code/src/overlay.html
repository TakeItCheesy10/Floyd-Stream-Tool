<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Floyd Stream Tool — Live Overlay</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe{position:absolute;width:1920px;height:1080px;border:0;transform-origin:top left}</style>
</head><body><script>
// A permanent OBS source. Keep the existing frame during server outages.
const kind = location.pathname.split('/').pop();
const requiredGame = new URLSearchParams(location.search).get('game');
let activeGame, currentFrame, pendingFrame;
function fit() {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelectorAll('iframe').forEach(frame => frame.style.transform = `scale(${scale})`);
}
addEventListener('resize', fit);
async function refresh() {
    try {
        const response = await fetch('/api/active-game', { cache: 'no-store' });
        if (!response.ok) throw new Error('Overlay connection lost');
        const data = await response.json();
        if (requiredGame && data.gameId !== requiredGame) {
            pendingFrame?.remove(); pendingFrame = null;
            currentFrame?.remove(); currentFrame = null; activeGame = null;
            setTimeout(refresh, 500);
            return;
        }
        if (data.gameId !== activeGame && !pendingFrame) {
            const url = data.layouts[kind];
            const check = await fetch(url, { method: 'HEAD' });
            if (!check.ok) throw new Error('Layout unavailable');
            const frame = document.createElement('iframe');
            pendingFrame = frame;
            frame.title = data.name + ' ' + kind;
            frame.style.visibility = 'hidden';
            frame.onload = () => {
                currentFrame?.remove(); frame.style.visibility = 'visible';
                currentFrame = frame; pendingFrame = null; activeGame = data.gameId;
            };
            frame.src = url;
            document.body.append(frame); fit();
        }
    } catch (error) { console.warn(error.message); }
    setTimeout(refresh, 500);
}
refresh();
</script></body></html>
